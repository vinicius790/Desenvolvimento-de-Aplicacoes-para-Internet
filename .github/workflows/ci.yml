name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint via react-scripts)
        run: npx eslint src --ext .js,.jsx || true

      - name: Run tests
        run: CI=true npm test -- --watchAll=false --coverage=false

      - name: Build
        run: npm run build
